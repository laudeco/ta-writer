services:
    php:
        build:
            context: ./docker/php
        working_dir: /app
        user: "${USERID:-1000}:${GROUPID:-1000}"
        environment:
            COMPOSER_HOME: /tmp/composer
            HOME: /tmp
            # the preview renders its diagrams while the editor keeps answering: the built-in server needs several workers
            PHP_CLI_SERVER_WORKERS: 4
        volumes:
            - .:/app
        ports:
            # local only: the API has no authentication, and the noVNC session shows a logged-in AGIR browser
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:6080:6080"
        command: php -S 0.0.0.0:8080 -t public
